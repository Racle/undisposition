<!doctype html>

<html lang="en">
  <head>
    <title>Undisposition settings</title>
    <link rel="shortcut icon" href="../icons/icon128.png" type="image/png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a2e;
        --bg-card: #16213e;
        --bg-inset: #0f1629;
        --border: #2a2a4a;
        --text: #e0e0e0;
        --text-heading: #fff;
        --text-muted: #b0b0b0;
        --text-dim: #888;
        --text-placeholder: #555;
        --label: #b0b0cc;
        --accent: #5084ee;
        --accent-hover: #6094ff;
        --accent-text: #fff;
        --green: #4caf50;
        --pink: #e91e63;
        --btn-secondary-bg: #2a2a4a;
        --btn-secondary-text: #ccc;
        --btn-secondary-hover: #3a3a5a;
        --segment-hover: #ccc;
        --result-green-bg: rgba(76, 175, 80, 0.1);
        --result-green-border: rgba(76, 175, 80, 0.3);
        --result-pink-bg: rgba(233, 30, 99, 0.1);
        --result-pink-border: rgba(233, 30, 99, 0.3);
        --mono: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f5f5f7;
          --bg-card: #ffffff;
          --bg-inset: #f0f0f4;
          --border: #d0d0d8;
          --text: #1a1a2e;
          --text-heading: #111;
          --text-muted: #555;
          --text-dim: #777;
          --text-placeholder: #aaa;
          --label: #555;
          --accent: #4070d8;
          --accent-hover: #3060c8;
          --accent-text: #fff;
          --btn-secondary-bg: #e0e0e8;
          --btn-secondary-text: #444;
          --btn-secondary-hover: #d0d0d8;
          --segment-hover: #444;
          --result-green-bg: rgba(76, 175, 80, 0.08);
          --result-green-border: rgba(76, 175, 80, 0.25);
          --result-pink-bg: rgba(233, 30, 99, 0.08);
          --result-pink-border: rgba(233, 30, 99, 0.25);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      body {
        max-width: 560px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .header img {
        width: 36px;
        height: 36px;
      }

      .header h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-heading);
      }

      /* Cards */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
      }

      .card h2 {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--label);
        margin-bottom: 16px;
      }

      .card label {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      /* Segmented control */
      .segmented-control {
        display: inline-flex;
        background: var(--bg-inset);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
      }

      .segmented-control input[type='radio'] {
        display: none;
      }

      .segmented-control label {
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-dim);
        transition: all 0.2s ease;
        user-select: none;
      }

      .segmented-control input[type='radio']:checked + label {
        background: var(--accent);
        color: var(--accent-text);
      }

      .segmented-control label:hover {
        color: var(--segment-hover);
      }

      .segmented-control input[type='radio']:checked + label:hover {
        color: var(--accent-text);
      }

      /* List sections */
      .list-section {
        display: none;
        margin-top: 16px;
      }

      .list-section.active {
        display: block;
      }

      /* Textarea */
      textarea {
        width: 100%;
        min-height: 160px;
        background: var(--bg-inset);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font-family: var(--mono), monospace;
        font-size: 0.85rem;
        line-height: 1.6;
        resize: vertical;
        transition: border-color 0.2s ease;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      textarea::placeholder {
        color: var(--text-placeholder);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-text);
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
      }

      .btn-secondary:hover {
        background: var(--btn-secondary-hover);
      }

      .save-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      /* Toast */
      .toast {
        font-size: 0.85rem;
        color: var(--green);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .toast.visible {
        opacity: 1;
      }

      /* Tester */
      .tester-row {
        display: flex;
        gap: 8px;
      }

      .tester-row input[type='text'] {
        flex: 1;
        background: var(--bg-inset);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.9rem;
        transition: border-color 0.2s ease;
      }

      .tester-row input[type='text']:focus {
        outline: none;
        border-color: var(--accent);
      }

      .tester-row input[type='text']::placeholder {
        color: var(--text-placeholder);
      }

      /* Test result */
      .test-result {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        display: none;
      }

      .test-result.visible {
        display: block;
      }

      /* Blocklist match = blocked (bad for inline), allowlist no-match = not allowed (bad) */
      .test-result.blocked {
        background: var(--result-pink-bg);
        border: 1px solid var(--result-pink-border);
        color: var(--pink);
      }

      .test-result.active-on {
        background: var(--result-green-bg);
        border: 1px solid var(--result-green-border);
        color: var(--green);
      }
    </style>
  </head>

  <body>
    <div class="header">
      <img src="../icons/icon128.png" alt="" />
      <h1>Undisposition Settings</h1>
    </div>

    <div class="card">
      <h2>List Mode</h2>
      <div class="segmented-control">
        <input type="radio" name="listMode" id="mode-blocklist" value="blocklist" checked />
        <label for="mode-blocklist">Blocklist</label>
        <input type="radio" name="listMode" id="mode-allowlist" value="allowlist" />
        <label for="mode-allowlist">Allowlist</label>
      </div>

      <div id="blocklist-section" class="list-section active">
        <label for="blacklist">Undisposition is active on all domains <strong>except</strong> these. One domain per line.</label>
        <textarea id="blacklist" placeholder="example.com&#10;drive.google.com" spellcheck="false"></textarea>
      </div>

      <div id="allowlist-section" class="list-section">
        <label for="allowlist">Undisposition is <strong>only</strong> active on these domains. One domain per line.</label>
        <textarea id="allowlist" placeholder="example.com&#10;gitlab.com" spellcheck="false"></textarea>
      </div>

      <div class="save-row">
        <button class="btn btn-primary" id="submit">Save</button>
        <span class="toast" id="saveToast">Saved</span>
      </div>
    </div>

    <div class="card">
      <h2>Domain Tester</h2>
      <label for="test">Check if a domain matches the current list.</label>
      <div class="tester-row">
        <input type="text" id="test" placeholder="https://example.com/file.pdf" spellcheck="false" />
        <button class="btn btn-secondary" id="testButton">Test</button>
      </div>
      <div class="test-result" id="testResult"></div>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
